[project]
name = "hello-robot-stretch-mujoco"
version = "0.5.0"
description = "A Stretch simulation in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.8",
    "hello-robot-stretch-urdf>=0.1.0",
    "inputs>=0.5",
    "matplotlib>=3.10.1",
    "mujoco==3.2.6", # 3.2.6 is required for Robocasa compatibility
    "opencv-python",
    "openpi-client",
    "pynput>=1.8.1",
    "urchin>=0.0.29",
]
authors = [
    {name = "Binit Shah", email = "bshah@hello-robot.com"},
    {name = "Shehab Attia", email = "sattia@hello-robot.com"},
]
license = { file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.gui-scripts]
launch_sim = "stretch_mujoco.launch_sim:main"

[project.scripts]
prepare_smplx_npc = "stretch_mujoco.humanoid.smplx_converter:main"
review_amass_npc_motion = "stretch_mujoco.humanoid.amass_motion_review:main"
bake_smplx_animations = "stretch_mujoco.humanoid.smplx_animation_baker:main"
prepare_amass_npc_motion = "stretch_mujoco.humanoid.amass_intake:main"
validate_npc_assets = "stretch_mujoco.npc.assets:main"
build_npc_scene = "stretch_mujoco.npc.scene_builder:main"
bake_npc_appearance = "stretch_mujoco.npc.appearance_pipeline.bake:main"
make_npc_flat_layers = "stretch_mujoco.npc.appearance_pipeline.flat_layers:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "stretch_mujoco"
module-root = ""
source-exclude = ["third_party/**", "tests/**", "**/*.local.json"]

[tool.uv.sources]
openpi-client = { path = "../openpi/packages/openpi-client", editable = true }

[project.urls]
Source = "https://github.com/hello-robot/stretch_mujoco"
Tracker = "https://github.com/hello-robot/stretch_mujoco/issues"

[tool.black]
line-length = 100

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "flake8",
    "black",
    "mypy",
]
jupyter = [
    "ipykernel",
    "ipython",
]
graspgen = [
    "msgpack>=1.0",
    "msgpack-numpy>=0.4.8",
    "pyzmq>=26",
    "scipy>=1.10",
]
vlfm = [
    "openai>=1.0",
    "pillow>=10.0",
    "protobuf>=4.25",
    "torch>=2.2",
    "transformers>=4.40",
]
robocasa = [
     # Python 3.10 is required for Robocasa compatibility
    "opencv-python==4.8.1.78",
    "numpy==1.23.5",
    "numba==0.59"
]
